name: C++ CI Pipeline

on:
  push:
    branches: [ "main", "feature-lab1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Скачиваем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем зависимости (CMake, компилятор, gcovr)
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ gcovr

    - name: Конфигурируем CMake (с покрытием)
      run: cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

    - name: Собираем проект
      run: cmake --build lab1/build

    - name: Запускаем тесты
      working-directory: lab1/build
      run: ctest --output-on-failure

    - name: Считаем покрытие (gcovr)
      working-directory: lab1/build
      run: |
        echo "### Отчет о покрытии кода (gcovr)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        # gcovr автоматически найдет только запущенные файлы (.gcda) и посчитает правильные проценты
        gcovr -r .. --exclude '.*_deps.*' --exclude '.*tests.*' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
