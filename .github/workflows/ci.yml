name: C++ CI Pipeline

on:
  push:
    branches: [ "main", "feature-lab1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Скачиваем код из репозитория
      uses: actions/checkout@v4

    - name: Устанавливаем зависимости (CMake, компилятор)
      run: sudo apt-get update && sudo apt-get install -y cmake g++

    - name: Конфигурируем CMake
      run: cmake -S lab1 -B lab1/build

    - name: Собираем проект
      run: cmake --build lab1/build

    - name: Запускаем тесты
      working-directory: lab1/build
      run: ctest --output-on-failure
